services:
  db:
    image: postgres:18
    container_name: mfc_postgres

    environment:
      POSTGRES_DB: mfc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/db:/docker-entrypoint-initdb.d:ro

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mfc"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: mfc_backend

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_DATABASE: mfc
      PG_USER: postgres
      PG_PASSWORD: postgres

    ports:
      - "5000:5000"

volumes:
  postgres_data: